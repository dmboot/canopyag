# ============================================================================
# ros2_control controller manager + controllers
# ============================================================================
# Used by BOTH Gazebo (loaded by the gz_ros2_control plugin) and the real
# robot (loaded by ros2_control_node) - that is the point of the ros2_control
# layer.
#
# The joint names below must match `joints:` in robot_parameters.yaml. If a
# re-import adds, removes or renames a joint, update this file too;
# test/test_urdf_parses.py fails the build when the two drift apart.
# ============================================================================

controller_manager:
  ros__parameters:
    update_rate: 200            # Hz
    use_sim_time: true          # overridden to false by hardware.launch.py

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    crate_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Bring-up / homing: pokes a single joint with
    #   ros2 topic pub /forward_position_controller/commands ...
    # Activate it INSTEAD of arm_controller, never alongside - two controllers
    # claiming the same command interface will refuse to activate.
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController


arm_controller:
  ros__parameters:
    joints:
      - z_carriage
      - joint_1
      - joint_2
      - joint_3
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      z_carriage: { trajectory: 0.02, goal: 0.005 }
      joint_1:    { trajectory: 0.10, goal: 0.01 }
      joint_2:    { trajectory: 0.10, goal: 0.01 }
      joint_3:    { trajectory: 0.10, goal: 0.01 }


# The crate rides the same gantry but is not part of the arm's kinematic
# chain, so it gets its own controller and can be moved independently.
crate_controller:
  ros__parameters:
    joints: [z_crate]
    command_interfaces: [position]
    state_interfaces: [position, velocity]


forward_position_controller:
  ros__parameters:
    joints:
      - z_carriage
      - joint_1
      - joint_2
      - joint_3
    interface_name: position
