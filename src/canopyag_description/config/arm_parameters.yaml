# ============================================================================
# canopy.ag SCARA - kinematic & inertial parameters
# ============================================================================
# THIS IS THE ONLY FILE YOU SHOULD NEED TO EDIT to make the model match the
# real arm. The xacro reads everything from here.
#
# Units: metres, radians, kilograms. Never degrees, never mm.
#
# How to get the numbers out of SolidWorks (SCARA_V2-Assem.SLDASM):
#   origin_xyz : distance from the PARENT joint axis to THIS joint axis,
#                measured in the parent link's frame, with the arm in its
#                zero pose (all joints at 0). Use Measure between the two
#                axes/cylindrical faces.
#   mass       : Evaluate > Mass Properties > Mass  (set material first!)
#   bbox       : Evaluate > Bounding Box, or just measure the part envelope.
#                Only used for inertia + collision when use_meshes is false.
#   lower/upper: drive to each hard stop / limit switch and read the angle.
#
# Everything below is a PLACEHOLDER that produces a plausible-looking arm.
# Nothing here is measured from your CAD - replace the numbers.
# ============================================================================

# ---------------------------------------------------------------------------
# Global options
# ---------------------------------------------------------------------------
options:
  # false -> links are drawn as boxes/cylinders from `bbox` below (works now).
  # true  -> links are drawn from meshes/visual/*.stl (see meshes/README.md).
  use_meshes: false

  # Height of the extrusion column base above the floor plane.
  floor_offset: 0.0

# ---------------------------------------------------------------------------
# Joints
# ---------------------------------------------------------------------------
# NOTE ON THE JOINT CHAIN: this is my best reconstruction from the CAD part
# names (Z-axis Assem + Z-axisGearbox, ArmSegmentV3 x2 on GT2_80t pulleys,
# 5to1LastSegment, ParallelServoGripAssem with 2x MG996R). Five NEMAs map to
# the five joints below. If your 5th NEMA does something else - a gantry rail
# under the column, a second Z, a differential wrist - tell me and I'll
# restructure. Everything else in the stack survives that change unedited.
#
# gear_ratio is informational here (the URDF doesn't use it) but the CAN
# hardware interface will, to convert joint units <-> motor steps.
# ---------------------------------------------------------------------------
joints:

  # NEMA 1 - vertical lift. Belt + Z-axisGearbox, V-wheel carriage on 20x40.
  z_lift_joint:
    type: prismatic
    axis: [0.0, 0.0, 1.0]
    origin_xyz: [0.0, 0.0, 0.150]      # column base -> bottom of Z travel
    origin_rpy: [0.0, 0.0, 0.0]
    lower: 0.0
    upper: 0.600                        # TODO measure actual Z travel
    max_velocity: 0.25                  # m/s
    max_effort: 150.0                   # N
    gear_ratio: 20.0                    # motor rev -> m (pulley pitch dia * ratio)

  # NEMA 2 - shoulder. ArmSegmentV3 driven by GT2 80t.
  shoulder_joint:
    type: revolute
    axis: [0.0, 0.0, 1.0]
    origin_xyz: [0.0, 0.0, 0.060]      # carriage top -> shoulder axis
    origin_rpy: [0.0, 0.0, 0.0]
    lower: -2.60
    upper: 2.60
    max_velocity: 1.5                   # rad/s
    max_effort: 40.0                    # Nm
    gear_ratio: 4.0                     # 80t / 20t

  # NEMA 3 - elbow. Second ArmSegmentV3.
  elbow_joint:
    type: revolute
    axis: [0.0, 0.0, 1.0]
    origin_xyz: [0.300, 0.0, 0.0]      # shoulder axis -> elbow axis (upper arm length)
    origin_rpy: [0.0, 0.0, 0.0]
    lower: -2.40
    upper: 2.40
    max_velocity: 1.5
    max_effort: 25.0
    gear_ratio: 4.0

  # NEMA 4 - wrist rotation. "5to1LastSegment".
  wrist_roll_joint:
    type: revolute
    axis: [0.0, 0.0, 1.0]
    origin_xyz: [0.300, 0.0, 0.0]      # elbow axis -> wrist axis (forearm length)
    origin_rpy: [0.0, 0.0, 0.0]
    lower: -3.14
    upper: 3.14
    max_velocity: 2.0
    max_effort: 10.0
    gear_ratio: 5.0

  # NEMA 5 - tool pitch. <<< LEAST CERTAIN JOINT - see note above.
  tool_pitch_joint:
    type: revolute
    axis: [0.0, 1.0, 0.0]
    origin_xyz: [0.080, 0.0, -0.040]
    origin_rpy: [0.0, 0.0, 0.0]
    lower: -1.57
    upper: 1.57
    max_velocity: 2.0
    max_effort: 8.0
    gear_ratio: 5.0

# ---------------------------------------------------------------------------
# End effector - 2x MG996R hobby servo (ParallelServoGripAssem)
# ---------------------------------------------------------------------------
# MG996R is open-loop PWM: no position feedback, ~180 deg range, and it will
# happily stall. The hardware interface echoes the command back as state.
gripper:
  # Servo 1 - tool roll (ServoGT2Pulley drives the tool plate).
  tool_roll_joint:
    axis: [1.0, 0.0, 0.0]
    origin_xyz: [0.050, 0.0, 0.0]
    origin_rpy: [0.0, 0.0, 0.0]
    lower: -1.57
    upper: 1.57
    max_velocity: 3.0
    max_effort: 1.5                     # Nm, MG996R stall ~ 1.0 Nm at 6V

  # Servo 2 - parallel jaws. finger_joint is driven; the opposite jaw mimics it.
  finger_joint:
    axis: [0.0, 1.0, 0.0]               # jaws slide along +/- Y
    origin_xyz: [0.040, 0.020, 0.0]
    origin_rpy: [0.0, 0.0, 0.0]
    lower: 0.0                          # closed
    upper: 0.035                        # fully open, per jaw
    max_velocity: 0.1
    max_effort: 20.0                    # N

  # Where MoveIt / your pick code should aim. Measured from the tool plate to
  # the point midway between the jaw tips.
  tcp_xyz: [0.090, 0.0, 0.0]
  tcp_rpy: [0.0, 0.0, 0.0]

# ---------------------------------------------------------------------------
# Links - mass + bounding box
# ---------------------------------------------------------------------------
# bbox is [x, y, z] of the link's envelope, and the box is centred on
# `com_xyz` relative to the link's own origin (its parent joint axis).
links:
  base_link:
    mass: 8.000
    bbox: [0.120, 0.120, 1.200]         # SCARA Weldment + 20x40 column
    com_xyz: [0.0, 0.0, 0.600]
    mesh: base_link

  lift_link:
    mass: 1.200                         # carriage + V-wheels + plate
    bbox: [0.100, 0.120, 0.100]
    com_xyz: [0.0, 0.0, 0.0]
    mesh: lift_link

  upper_arm_link:
    mass: 0.900                         # ArmSegmentV3
    bbox: [0.340, 0.070, 0.060]
    com_xyz: [0.150, 0.0, 0.0]
    mesh: upper_arm_link

  forearm_link:
    mass: 0.700
    bbox: [0.340, 0.060, 0.055]
    com_xyz: [0.150, 0.0, 0.0]
    mesh: forearm_link

  wrist_link:
    mass: 0.250                         # 5to1LastSegment
    bbox: [0.100, 0.055, 0.055]
    com_xyz: [0.040, 0.0, 0.0]
    mesh: wrist_link

  tool_link:
    mass: 0.180                         # tool plate + pitch bracket
    bbox: [0.060, 0.050, 0.050]
    com_xyz: [0.025, 0.0, 0.0]
    mesh: tool_link

  gripper_base_link:
    mass: 0.150                         # ParallelServoGripBody + servos
    bbox: [0.070, 0.060, 0.045]
    com_xyz: [0.030, 0.0, 0.0]
    mesh: gripper_base_link

  finger_link:
    mass: 0.030                         # ParallelGripDynamicJaw
    bbox: [0.050, 0.012, 0.030]
    com_xyz: [0.025, 0.0, 0.0]
    mesh: finger_link
