    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.4434, 0.074, 0.077], xyz: [0.1917, 0.0, 0.0356]}
    mass: 0.797529595
    com_xyz: [0.1932823, -1.4064e-05, 0.049226311]
