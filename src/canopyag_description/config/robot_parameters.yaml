joints:
  z_crate:
    type: prismatic
    parent: gantry
    child: crate
    xyz: [0.071, -0.00085, 0.24636]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 200.0, velocity: 0.25, lower: 0.0, upper: 1.05}
    dynamics: {damping: 0.0, friction: 0.0}
  z_carriage:
    note: |-
      The export's limits (0.17 .. 1.22) are measured from the crate's zero
      (gantry z 0.24636), but this joint's zero is where the carriage sits in
      the CAD assembly (gantry z 0.97749), 0.73113 higher. Taken as exported
      the carriage would leave the top of the 1.66 m gantry. Shifted here:
      0.17 - 0.73113 = -0.56113, 1.22 - 0.73113 = 0.48887. Put the carriage
      at its home position in SolidWorks before exporting and this goes away.
    type: prismatic
    parent: gantry
    child: carriage
    xyz: [0.071, -0.00085, 0.97749]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 200.0, velocity: 0.25, lower: -0.56113, upper: 0.48887}
