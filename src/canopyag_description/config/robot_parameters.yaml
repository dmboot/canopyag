# ===========================================================================
# canopyag - every number the URDF is built from
# ===========================================================================
# GENERATED by scripts/import_solidworks_urdf.py from a SolidWorks export.
# Editing it by hand is fine and expected: re-running the importer keeps
#   links:  note, material, visual_xyz, visual_rpy
#   joints: note, limit, dynamics
# and the whole mount / meshes / materials sections. Everything else
# (topology, origins, axes, mass, inertia) comes back from the export.
#
# Units are metres, radians, kilograms. Frames follow URDF: a joint's xyz/rpy
# is its origin in the PARENT link's frame, and a link's mesh is drawn in that
# link's own frame.
#
# A `note:` on any entry is free text that survives a re-import - the # comments
# in this file do not, so record anything you want to keep as a note.

robot:
  name: canopyag
  root_link: gantry

# world -> root_link. This is where you place the robot in the scene, and
# where you fix a SolidWorks assembly that was not modelled Z-up.
mount:
  parent: world
  xyz: [0.0, 0.0, 0.0]
  rpy: [1.5707963, 0.0, 0.0]
  note: |-
    The assembly is modelled Y-up: joint_z1 lifts along +Y and the column's
    long axis is Y. ROS, RViz and Gazebo are Z-up, so rotate +90 deg about X
    here. Set this back to [0, 0, 0] once the CAD is exported Z-up.

meshes:
  package: canopyag_description
  visual_dir: meshes/visual
  collision_dir: meshes/collision
  scale: [1.0, 1.0, 1.0]
  # false -> collision reuses the visual mesh (fine for RViz and MoveIt).
  # true  -> collision uses collision_dir, which must hold decimated copies.
  #          Do that before running Gazebo; raw exports are ~25k triangles
  #          a link and the physics step will crawl.
  use_collision_meshes: false

materials:
  structure: [0.7922, 0.8196, 0.9333, 1.0]
  crate: [1.0, 1.0, 1.0, 1.0]

links:
  gantry:
    note: |-
      gantry.stl came out of the exporter in a frame rotated -90 deg about X
      relative to the gantry link frame: its bounding box and its inertia
      tensor disagree by exactly that, and every other link matches. The
      visual_rpy below puts the mesh back. The real fix is the reference
      coordinate system of the base link in SolidWorks - set visual_rpy to
      [0, 0, 0] once that is corrected.
    mesh: gantry.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [-1.5707963, 0.0, 0.0]
    mass: 4.865445211
    com_xyz: [0.483091173, 0.737554686, 1.979702241]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.101420482246, ixy: -1.067751e-06, ixz: -5.491538e-06, iyy: 0.008605789311, iyz: 1.419197e-06, izz: 0.098793849332}
