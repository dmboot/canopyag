# ===========================================================================
# canopyag - every number the URDF is built from
# ===========================================================================
# GENERATED by scripts/import_solidworks_urdf.py from a SolidWorks export.
# Editing it by hand is fine and expected: re-running the importer keeps
#   links:  note, material, visual_xyz, visual_rpy, collision_box
#   joints: note, limit, dynamics
# and the whole mount / meshes / materials sections. Everything else
# (topology, origins, axes, mass, inertia) comes back from the export.
#
# Units are metres, radians, kilograms. Frames follow URDF: a joint's xyz/rpy
# is its origin in the PARENT link's frame, and a link's mesh is drawn in that
# link's own frame.
#
# A `note:` on any entry is free text that survives a re-import - the # comments
# in this file do not, so record anything you want to keep as a note.

robot:
  name: canopyag
  root_link: gantry

# world -> root_link. This is where you place the robot in the scene, and
# where you fix a SolidWorks assembly that was not modelled Z-up.
mount:
  parent: world
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

meshes:
  package: canopyag_description
  visual_dir: meshes/visual
  collision_dir: meshes/collision
  scale: [1.0, 1.0, 1.0]
  # false -> collision reuses the visual mesh (fine for RViz).
  # true  -> collision uses collision_dir, which must hold decimated copies.
  #          Raw exports are ~25k triangles a link.
  use_collision_meshes: false

materials:
  structure: [0.7922, 0.8196, 0.9333, 1.0]
  crate: [1.0, 1.0, 1.0, 1.0]

# Prismatic joints whose moving mass is balanced by a counterweight on the
# other side of the gantry. `mass` is the counterweight itself; when it
# equals the mass that joint carries, the axis feels no gravity load.
# The links keep their real mass and inertia either way - only gravity along
# the axis is offset. Only a record of the robot for now: nothing reads it.
counterweights:
  z_carriage:
    note: |-
      Assumed fully balanced: carriage + mid_link + endeffector_link +
      end_effector from the CAD. Replace with the weighed counterweight.
    mass: 2.718675
  z_crate:
    note: |-
      Assumed fully balanced against the empty crate from the CAD. A full
      crate is heavier than its counterweight - raise crate mass or add a
      payload link if that load matters.
    mass: 0.598668

links:
  gantry:
    mesh: gantry.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.1838, 0.367, 1.54], xyz: [0.0119, 0.0, 0.77]}
    mass: 6.164941163
    com_xyz: [0.017144702, 4.6722e-05, 1.048507935]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.324953863473, ixy: 6.1934e-08, ixz: -0.000116331498, iyy: 0.326287146104, iyz: -1.7924e-08, izz: 0.011889633158}
  crate:
    note: |-
      Collision box is the mesh bounding box with its top lowered 10 mm:
      at home the carriage's bearing blocks reach 5 mm into the crate's
      bounding box, and an overlapping pair would make the home state a
      collision. The lowered box leaves 5 mm between them.
    mesh: crate.stl
    material: crate
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.0859, 0.342, 0.1944], xyz: [-0.03275, 0.0, 0.0578]}
    mass: 0.575483633
    com_xyz: [-0.013636181, -0.000140376, 0.090845484]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.003498462481, ixy: 0.0, ixz: -2.4322e-07, iyy: 0.000878987219, iyz: 5.1e-11, izz: 0.002693492557}
  carriage:
    mesh: carriage.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.2587, 0.342, 0.2044], xyz: [0.05365, 0.0, 0.0628]}
    mass: 1.55579936
    com_xyz: [0.036750157, -0.000112314, 0.069750367]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.005474877306, ixy: 1.426898e-06, ixz: 0.000221225565, iyy: 0.003032775933, iyz: -7.48921e-07, izz: 0.005829140378}
  midlink:
    mesh: midlink.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    mass: 0.80121352
    com_xyz: [0.18139091, -3.1091e-05, -0.016951333]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.000528613757, ixy: 7.211897e-06, ixz: -0.00013202882, iyy: 0.011917134964, iyz: -7.53537e-07, izz: 0.01235417296}
  endeffector_link:
    mesh: endeffector_link.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.2995, 0.068, 0.06], xyz: [0.13875, 0.0, 0.0094]}
    mass: 0.262099236
    com_xyz: [0.133663714, 4.3637e-05, -0.026831362]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 7.1499516e-05, ixy: -9.13e-09, ixz: 2.1767611e-05, iyy: 0.001620605624, iyz: 1.8903e-08, izz: 0.001669772791}
  endeffector:
    mesh: endeffector.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    mass: 0.217349032
    com_xyz: [0.075359882, 0.000456578, -0.027923524]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 7.1302648e-05, ixy: -1.70531e-07, ixz: 1.340157e-06, iyy: 8.5696978e-05, iyz: 9.66513e-07, izz: 0.000112902268}

joints:
  z_crate:
    note: |-
      SolidWorks writes prismatic limits as limit-mate distances, i.e. the
      height of the crate frame above the gantry base: 0.1681 .. 0.6485,
      exported at the bottom (lower == xyz z). The joint counts from that
      home position, so the limit is 0 .. 0.6485 - 0.1681.
    type: prismatic
    parent: gantry
    child: crate
    xyz: [0.094911, 0.0005, 0.1328]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 200.0, velocity: 1.0, lower: 0.0, upper: 0.9}
    dynamics: {damping: 0.0, friction: 0.0}
  z_carriage:
    note: |-
      SolidWorks writes prismatic limits as limit-mate distances, i.e. the
      height of the carriage frame above the gantry base: 0.3675 .. 0.8135,
      exported at the bottom (lower == xyz z). The joint counts from that
      home position, so the limit is 0 .. 0.8135 - 0.3675.
    type: prismatic
    parent: gantry
    child: carriage
    xyz: [0.094911, 0.0005, 0.2978]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 200.0, velocity: 1.0, lower: 0.0, upper: 0.9}
    dynamics: {damping: 0.0, friction: 0.0}
  joint_1:
    type: revolute
    parent: carriage
    child: midlink
    xyz: [0.1514, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 50.0, velocity: 3.0, lower: -2.0944, upper: 2.0944}
    dynamics: {damping: 0.0, friction: 0.0}
  joint_2:
    type: revolute
    parent: midlink
    child: endeffector_link
    xyz: [0.3704, 0.0, -0.04375]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 50.0, velocity: 3.0, lower: -3.1416, upper: 3.1416}
    dynamics: {damping: 0.0, friction: 0.0}
  joint_3:
    note: |-
      Wrist yaw: NEMA17 on an MKS SERVO42D, 5:1. The export has no limits
      (continuous); lower/upper are set by hand and keep it revolute on a
      re-import. The cables to the pitch and gripper motors wind up: set
      them to how far those cables really allow from home (gripper along
      link 2). canopyag_motion needs at least -pi..pi to point the gripper
      to +y or -y everywhere; 1.5 turns lets the demo fold link 2 under link 1
      without a full turn of the gripper.
    type: revolute
    parent: endeffector_link
    child: endeffector
    xyz: [0.25484, 0.0, -0.038]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 50.0, velocity: 6.0, lower: -3.1416, upper: 3.1416}
    dynamics: {damping: 0.0, friction: 0.0}

