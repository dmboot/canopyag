    xyz: [0.1514, 0.0, -0.0788]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 50.0, velocity: 3.0, lower: -2.0944, upper: 2.0944}
    dynamics: {damping: 0.0, friction: 0.0}
  joint_2:
    type: revolute
    parent: mid_link
    child: endeffector_link
    xyz: [0.3684, 0.0, -0.0251]
    rpy: [0.0, 0.0, 0.0]
