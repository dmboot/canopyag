    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    mass: 5.434082892
    com_xyz: [0.005832611, -0.000182447, 1.071368327]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.324675201988, ixy: 5.585539e-06, ixz: -8.03894e-07, iyy: 0.322069174878, iyz: 4.139705e-06, izz: 0.008758488134}
