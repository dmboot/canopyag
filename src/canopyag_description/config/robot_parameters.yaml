# ===========================================================================
# canopyag - every number the URDF is built from
# ===========================================================================
# GENERATED by scripts/import_solidworks_urdf.py from a SolidWorks export.
# Editing it by hand is fine and expected: re-running the importer keeps
#   links:  note, material, visual_xyz, visual_rpy, collision_box
#   joints: note, limit, dynamics
# and the whole mount / meshes / materials sections. Everything else
# (topology, origins, axes, mass, inertia) comes back from the export.
#
# Units are metres, radians, kilograms. Frames follow URDF: a joint's xyz/rpy
# is its origin in the PARENT link's frame, and a link's mesh is drawn in that
# link's own frame.
#
# A `note:` on any entry is free text that survives a re-import - the # comments
# in this file do not, so record anything you want to keep as a note.

robot:
  name: canopyag
  root_link: gantry

# world -> root_link. This is where you place the robot in the scene, and
# where you fix a SolidWorks assembly that was not modelled Z-up.
mount:
  parent: world
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

meshes:
  package: canopyag_description
  visual_dir: meshes/visual
  collision_dir: meshes/collision
  scale: [1.0, 1.0, 1.0]
  # false -> collision reuses the visual mesh (fine for RViz).
  # true  -> collision uses collision_dir, which must hold decimated copies.
  #          Do that before running Gazebo; raw exports are ~25k triangles
  #          a link and the physics step will crawl.
  use_collision_meshes: false

materials:
  structure: [0.7922, 0.8196, 0.9333, 1.0]
  crate: [1.0, 1.0, 1.0, 1.0]

# Prismatic joints whose moving mass is balanced by a counterweight on the
# other side of the gantry. `mass` is the counterweight itself; when it
# equals the mass that joint carries, the axis feels no gravity load.
# The links keep their real mass and inertia either way - only gravity along
# the axis is offset. Gazebo applies it as a constant upward force on the
# joint's child link (see canopyag_bringup/launch/gazebo.launch.py).
counterweights:
  z_carriage:
    note: |-
      Assumed fully balanced: carriage + mid_link + endeffector_link +
      end_effector from the CAD. Replace with the weighed counterweight.
    mass: 2.718675
  z_crate:
    note: |-
      Assumed fully balanced against the empty crate from the CAD. A full
      crate is heavier than its counterweight - raise crate mass or add a
      payload link if that load matters.
    mass: 0.598668

links:
  gantry:
    mesh: gantry.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.1838, 0.367, 1.54], xyz: [0.0119, 0.0, 0.77]}
    mass: 6.164941163
    com_xyz: [0.017144702, 4.6722e-05, 1.048507935]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.324953863473, ixy: 6.1934e-08, ixz: -0.000116331498, iyy: 0.326287146104, iyz: -1.7924e-08, izz: 0.011889633158}
  crate:
    note: |-
      Collision box is the mesh bounding box with its top lowered 10 mm:
      at home the carriage's bearing blocks reach 5 mm into the crate's
      bounding box, and an overlapping pair would make the home state a
      collision. The lowered box leaves 5 mm between them.
    mesh: crate.stl
    material: crate
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.0859, 0.342, 0.1944], xyz: [-0.03275, 0.0, 0.0578]}
    mass: 0.598668211
    com_xyz: [-0.013456256, 6.939e-06, 0.084943201]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.003609057017, ixy: -1e-12, ixz: 4.70288e-07, iyy: 0.000946458193, iyz: -7.9e-11, izz: 0.002743843778}
  carriage:
    mesh: carriage.stl
    material: structure
    visual_xyz: [0.0, 0.0, 0.0]
    visual_rpy: [0.0, 0.0, 0.0]
    collision_box: {size: [0.2587, 0.342, 0.2044], xyz: [0.05365, 0.0, 0.0628]}
    mass: 1.420508553
    com_xyz: [0.034813035, -2.524e-06, 0.067991978]
    com_rpy: [0.0, 0.0, 0.0]
    inertia: {ixx: 0.004934504176, ixy: 2.061967e-06, ixz: 0.000237829835, iyy: 0.002973825367, iyz: -1.166231e-06, izz: 0.005133779098}
  mid_link:
