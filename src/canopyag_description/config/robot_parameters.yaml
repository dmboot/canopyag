joints:
  z_crate:
    note: |-
      SolidWorks writes prismatic limits as limit-mate distances, i.e. the
      height of the crate frame above the gantry base: 0.1681 .. 0.6485,
      exported at the bottom (lower == xyz z). The joint counts from that
      home position, so the limit is 0 .. 0.6485 - 0.1681.
    type: prismatic
    parent: gantry
    child: crate
    xyz: [0.09165, -0.00125, 0.1681]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 200.0, velocity: 1.0, lower: 0.0, upper: 0.4804}
    dynamics: {damping: 0.0, friction: 0.0}
  z_carriage:
    note: |-
      SolidWorks writes prismatic limits as limit-mate distances, i.e. the
      height of the carriage frame above the gantry base: 0.3675 .. 0.8135,
      exported at the bottom (lower == xyz z). The joint counts from that
      home position, so the limit is 0 .. 0.8135 - 0.3675.
    type: prismatic
    parent: gantry
    child: carriage
    xyz: [0.09165, -0.00125, 0.3675]
    rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: {effort: 200.0, velocity: 1.0, lower: 0.0, upper: 0.446}
    dynamics: {damping: 0.0, friction: 0.0}
  joint_1:
