# ===========================================================================
# canopyag - joint <-> motor mapping for the real robot (canopyag_hardware)
# ===========================================================================
# The ONE file to edit when motors, gearing or CAN IDs change. It is only read
# when the xacro selects the real plugin (mock:=false); mock hardware never
# sees it. It is NOT touched by import_solidworks_urdf.py.
#
# Every value you are expected to change is marked  # <-- EDIT
#
# Per joint:
#   mode                can     = a real MKS SERVO57D / SERVO42D on the CAN bus
#                                 (same protocol, daisy-chained on one bus)
#                       virtual = no motor yet: the plugin copies command to
#                                 state (like mock hardware), no CAN traffic.
#                                 Only `mode` and `initial_position` are read.
#   can_id              the driver's CanID menu setting (1..2047, unique)
#   motor_revs_per_unit motor revolutions per rad (revolute / continuous) or
#                       per metre (prismatic):
#                         gearbox G on a revolute joint  -> G / (2 pi)
#                         lead screw / belt, L metres of travel per motor
#                         rev (after any gearbox)        -> 1 / L
#   reversed            true if a positive joint command turns the motor the
#                       wrong way
#   max_motor_rpm       safety cap on the speed sent in every F5. The driver's
#                       Mode caps it too: SR_CLOSE 1500, SR_vFOC 3000 (the
#                       drivers run SR_CLOSE). Above the Mode's cap the driver
#                       silently runs at the cap, so keep this <= 1500.
#                       A trajectory faster than this lags, and the trajectory
#                       controller aborts on its path tolerance. Keep it low for
#                       bring-up; raise it once direction and scaling are checked.
#   acceleration        MKS ramp 0..255 (0 = instant; the driver adds 1 RPM
#                       every (256 - acc) * 50 us)
#   initial_position    joint position at power-on, in joint units. The robot
#                       MUST be physically there when the plugin activates;
#                       0.0 = URDF home.
# ===========================================================================

hardware:
  # One cycle sends every motor its F5 and reads its encoder, one request at a
  # time, plus one stall poll: 2 x motors + 1 request/reply turns. Measured on
  # can0 with 4 motors (9 turns): 12-14.5 ms, about 1.5 ms a turn, so 100 Hz
  # never fit. 5 motors = 11 turns = about 16.5 ms: 50 Hz (20 ms) fits with
  # room for a slow reply. If the plugin still warns "CAN cycle takes ... ms",
  # use the rate it suggests.
  can_rate_hz: 50               # <-- EDIT: CAN cycle rate (bus budget: see README)
  reply_timeout_ms: 50          # <-- EDIT: startup wait for one reply
  max_missed_replies: 5         # <-- EDIT: fault after reply_timeout_ms * this without a 0x31 reply
  startup_check_retries: 3      # <-- EDIT: 0x31 attempts per motor before configure fails

joints:
  z_carriage:
    mode: can                   # <-- EDIT
    can_id: 2                   # <-- EDIT
    # 2:1 gearbox -> GT2 belt (2 mm pitch, 6 mm wide) on a 20-tooth pulley:
    #   L = 20 * 0.002 m / 2 = 0.02 m per motor rev -> 1 / L = 50
    motor_revs_per_unit: 50.0   # <-- EDIT
    reversed: false             # <-- EDIT
    max_motor_rpm: 1500         # <-- EDIT: 1500 rpm = 0.5 m/s at 50 rev/m (SR_CLOSE cap)
    acceleration: 252           # <-- EDIT: 5000 rpm/s = 1.67 m/s^2 at 50 rev/m
    initial_position: 0.0       # <-- EDIT

  joint_1:
    mode: can                   # <-- EDIT
    can_id: 3                   # <-- EDIT
    # 9.6:1 gearbox: 9.6 / (2 pi)
    motor_revs_per_unit: 1.5278874536821951  # <-- EDIT
    reversed: true              # <-- EDIT (check on the first move)
    max_motor_rpm: 1000         # <-- EDIT: 1000 rpm = 10.9 rad/s at the link
    # 230 not 240: under SR_vFOC 240 rang at ~3.4 Hz after every stop, 230
    # barely (tune_vfoc_joint1.py, 2026-10-28). Not re-measured in SR_CLOSE.
    # Keep it above motion.yaml's 6 rad/s^2.
    acceleration: 230           # <-- EDIT: 769 rpm/s = 8.4 rad/s^2
    initial_position: 0.0       # <-- EDIT

  z_crate:
    mode: virtual               # <-- EDIT
    can_id: 1                   # <-- EDIT
    # 4:1 gearbox
    motor_revs_per_unit: 100.0  # <-- EDIT 
    reversed: false             # <-- EDIT
    max_motor_rpm: 1000         # <-- EDIT: 0.16667 m/s at 100 rev/m
    acceleration: 250           # <-- EDIT: 3333 rpm/s = 0.55 m/s^2
    initial_position: 0.0       # <-- EDIT

  joint_2:
    mode: can                   # <-- EDIT 
    can_id: 4                   # <-- EDIT
    # 12:1 gearbox: 12 / (2 pi)
    motor_revs_per_unit: 1.909859317102744  # <-- EDIT
    reversed: false             # <-- EDIT
    max_motor_rpm: 900          # <-- EDIT: 900 rpm = 7.9 rad/s at the link
    acceleration: 240           # <-- EDIT: 1250 rpm/s = 10.9 rad/s^2
    initial_position: 0.0       # <-- EDIT

  joint_3:
    mode: can                   # <-- EDIT
    can_id: 5                   # <-- EDIT
    # 5:1 gearbox: 5 / (2 pi)
    motor_revs_per_unit: 0.7957747154594768  # <-- EDIT
    reversed: false             # <-- EDIT
    max_motor_rpm: 400          # <-- EDIT: 400 rpm = 8.4 rad/s at the wrist 
    acceleration: 240           # <-- EDIT: 1250 rpm/s = 26 rad/s^2
    initial_position: 0.0       # <-- EDIT
