# ===========================================================================
# canopyag_motion - how the robot moves to a goal
# ===========================================================================
# Read by motion_server.py at start-up (restart it after an edit; with
# --symlink-install no rebuild is needed). The geometry (joint origins,
# limits, collision boxes) comes from canopyag_description's
# robot_parameters.yaml, not from here.
#
# Every value you are expected to change is marked  # <-- EDIT
# ===========================================================================

# The tool point: what "move to (x, y, z)" puts there. The gripper tip, a
# point in `link`'s frame with the pitch at 0: end_effector (joint_3's link)
# or a link after it. The gripper points along that link's +x; from the CAD
# the tip is 0.21 m out along it from joint_3's axis.
tool:
  link: end_effector
  xyz: [0.21, 0.0, -0.008]      # <-- EDIT: measure the real tip

# Which way the gripper points: along world +y or -y, never anything else.
# joint_3 holds it there through every move (it is not planned on its own).
#   auto  the side of joint_1's axis the goal is on (for a joint goal: the
#         side the wrist ends up on; on the axis itself: where it points now)
#   +y    always to +y, -y always to -y
# A goal can choose (MoveTo heading, move_to.py --heading, the demo's side:=).
heading:
  default: auto                 # <-- EDIT: auto | +y | -y

# Top speed and acceleration of every joint (m, rad). Each joint moves at
# these, all at the same time. Keep them below what the motors can do:
# canopyag_description/config/hardware.yaml (max_motor_rpm, acceleration).
limits:
  z_carriage: {velocity: 0.25, acceleration: 0.5}   # <-- EDIT
  z_crate:    {velocity: 0.25, acceleration: 0.5}   # <-- EDIT
  joint_1:    {velocity: 3.5, acceleration: 5.0}    # <-- EDIT
  joint_2:    {velocity: 3.5, acceleration: 5.0}    # <-- EDIT
  # The wrist yaw. Also the limits for turning the heading (switching sides).
  # joint_3 moves with joint_1 and joint_2 to hold the heading; a plan that
  # would make it faster than this runs slower as a whole.
  joint_3:    {velocity: 6.0, acceleration: 15.0}   # <-- EDIT

collision:
  # Every collision box grows by this on every side. It covers the real robot
  # lagging its trajectory a little, and the box corners the check skips
  # between two samples.
  margin: 0.02                  # <-- EDIT: m
  # Check the path every time any point of the arm has moved this far.
  step: 0.01                    # <-- EDIT: m
  # Never checked against each other. The carriage and the crate are kept
  # apart by crate.gap instead: at home they are 5 mm apart, inside margin.
  ignore:
    - [carriage, crate]

crate:
  # The crate rides below the carriage. follow: true sends it to `trail`
  # below the carriage's goal with every move; false leaves it where it is
  # (at home: 0) and moves it only when the carriage would come closer than
  # `gap`. Either way a goal can send it somewhere (MoveTo crate, the goal
  # panel's crate slider).
  follow: false                 # <-- EDIT
  trail: 0.15                   # <-- EDIT: m, carriage goal - crate goal
  gap: 0.02                     # <-- EDIT: m, carriage - crate never less

execution:
  # Planning takes a few ms; the motion starts this long after the goal
  # arrives, the same instant on every controller.
  start_delay: 0.05             # <-- EDIT: s
  # Spacing of the trajectory points sent to the controllers.
  point_dt: 0.01                # <-- EDIT: s
